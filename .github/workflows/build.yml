# Builds the double-click downloads (Windows .exe, macOS and Linux) on GitHub's machines.
# Runs on every tag v* (and attaches the files to that release), or by hand from the Actions tab.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: TheWay.exe
            asset: TheWay-windows.exe
          - os: macos-latest
            file: TheWay
            asset: TheWay-macos
          - os: ubuntu-latest
            file: TheWay
            asset: TheWay-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: pyinstaller --noconfirm the-way.spec
      - run: python -c "import shutil; shutil.move('dist/${{ matrix.file }}', 'dist/${{ matrix.asset }}')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
