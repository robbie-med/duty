<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way</title>
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#23201b;--mute:#7a7265;--line:#d9d0bf;--seal:#8c2f1b;
  --kept:#3b7d4f;--strained:#c98a1b;--broken:#b33a2b;--severed:#1d1b19;--unset:#b9b0a0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,"Noto Sans KR",sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:Georgia,"Noto Serif KR",serif;font-weight:600;margin:0}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header h1{font-size:22px;letter-spacing:.02em}
header h1 span{color:var(--seal);margin-left:6px}
nav{display:flex;gap:2px}
nav button{border:0;background:none;padding:8px 12px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--seal);font-weight:600}
.grow{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.sm{padding:2px 7px;font-size:13px}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;max-width:100%}
.find{position:relative}
.find input{width:230px}
.drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;z-index:30;max-height:340px;overflow:auto;box-shadow:0 6px 18px #0002;min-width:260px}
.drop div{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.drop div:hover{background:var(--paper)}
.drop small,.mute{color:var(--mute)}
main{flex:1;min-height:0;display:none}
main.on{display:flex}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.stage .tools{flex:none;display:flex;gap:8px 10px;padding:9px 14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);z-index:5}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden}
.canvas.scroll{overflow:auto}
.canvas>svg{display:block;touch-action:none;cursor:grab;user-select:none}
.canvas>svg.panning{cursor:grabbing}
.zbtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:6}
.zbtns button{width:32px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-size:17px;line-height:1;box-shadow:0 1px 4px #0001}
.zbtns button:hover{border-color:var(--ink)}
select.lens{font-size:13px;padding:2px 6px}
.lchip{display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:1px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.lchip i{width:10px!important;height:10px!important;border-radius:50%;margin:0!important}
.lchip b{font-weight:600;color:var(--ink)}
.lchip:hover{border-color:var(--line)}.lchip.on{border-color:var(--ink);background:var(--card)}.lchip.off{opacity:.45}
.legend{flex-wrap:wrap}
svg .faded,.faded{opacity:.14}
svg.focus .wnode:not(.hi),svg.focus .spoke:not(.hi),svg.focus .nn:not(.hi),svg.focus .nl:not(.hi),svg.focus .nu:not(.hi){opacity:.12}
svg.far .rl{display:none}
.spoke.hi{stroke-width:4}
/* fan */
.fw path{fill-opacity:.2;stroke-width:1.3;cursor:pointer}
.fw:hover path{fill-opacity:.38}
.fw.dead path{fill-opacity:.09;stroke-dasharray:3 2}
.fw.sel path{stroke:var(--seal)!important;stroke-width:3;fill-opacity:.4}
.fw .nm{font-size:12px;font-weight:600}.fw .rl{font-size:10px;fill:var(--mute)}
.fw.ego circle{fill:var(--ink);cursor:pointer}.fw.ego text{fill:#fff;font-size:12.5px}
.fgap{cursor:pointer}.fgap path{fill:transparent;stroke:#b9b0a0;stroke-dasharray:4 4}.fgap:hover path{fill:#fff;stroke:var(--seal)}.fgap text{fill:#9a917f}
.axis{stroke:var(--line)}.fanlabel{font-size:12px;fill:var(--mute)}
/* duties grid */
.dgrid{padding:14px 16px}
.dtab td,.dtab th{font-size:12.5px;padding:4px 7px;white-space:nowrap}
.dtab th.who{cursor:pointer;background:var(--card);font-weight:600;min-width:190px}
.dtab th.who small{display:block;font-weight:400;color:var(--mute)}
.dtab th.who .dot,.dtab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dtab tr.on th.who{box-shadow:inset 4px 0 var(--seal)}
.dtab td.num{text-align:right;cursor:pointer}
.dtab td.dc{cursor:pointer;background:var(--card)}.dtab td.dc:hover{background:#fff;outline:2px solid var(--ink);outline-offset:-2px}
.dtab td.dc span:last-child{font-size:11px;color:var(--mute);margin-left:5px}
.dtab td.empty{background:transparent}
.sbar{display:inline-flex;height:10px;gap:2px;vertical-align:middle}
.sbar i,.dgrid .legend i{display:block;height:100%;border-radius:2px}
.dgrid .legend i{display:inline-block;width:14px;height:10px}
i.failing{background:var(--broken)}i.poorly{background:var(--strained)}i.kept{background:var(--kept)}i.na{background:#cfc7b8}i.open{background:#c9d7e6;box-shadow:inset 0 0 0 1px #2f6f9f}
.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{background:#f3dc9c}100%{background:transparent}}
/* atlas */
.nl{fill:none;stroke:#cbc2b0;stroke-width:1}
.nu{stroke:var(--seal);stroke-width:2.2;stroke-opacity:.55}.nu.divorced{stroke-dasharray:3 3}.nu.paramour{stroke-dasharray:1 3}
.nl.hi{stroke:var(--ink);stroke-width:2}.nu.hi{stroke-opacity:1;stroke-width:3}
.nn{cursor:pointer}.nn circle{stroke:var(--paper);stroke-width:2}
.nn text{font-size:9px;fill:var(--mute);display:none}
.nn.alive text,.nn.hi text,.nn.sel text,svg.near .nn text{display:block}
.nn.alive text{fill:var(--ink);font-size:10px}
.nn.hi text{font-size:12px;fill:var(--ink);font-weight:600}
.nn .ring{fill:none!important;stroke-width:2.2}.nn .ring.ego{stroke:var(--ink)}.nn .ring.head{stroke:var(--seal)}
.nn.sel circle:not(.ring){stroke:var(--seal);stroke-width:3}
.clan{fill:#fffdf8;stroke:var(--seal);stroke-width:1.5;stroke-opacity:.5}.clanlab{font-size:15px;font-weight:600;fill:var(--seal)}
.lineblob{fill:none;stroke:var(--mute);stroke-width:1.2;stroke-dasharray:5 4;stroke-opacity:.6}.linelab{font-size:11px;fill:var(--mute);letter-spacing:.04em}
.hb .blob{fill:#efe7d6;stroke:#cfc4ae;stroke-width:1}.hb.top .blob{fill:#f3e3dc;stroke:var(--seal)}.hb.headless .blob{fill:#f7e1dc;stroke:var(--broken);stroke-dasharray:4 3}
.hlab{font-size:10.5px;fill:var(--ink);font-weight:600;cursor:pointer;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.hm{cursor:pointer}.hm>circle:not(.ring){stroke:#fffdf8;stroke-width:1.5}.hm .ring{fill:none;stroke-width:2}.hm .ring.ego{stroke:var(--ink)}.hm .ring.head{stroke:var(--seal)}
.hm .mn{font-size:7px;fill:var(--ink);display:none;pointer-events:none}svg.near .hm .mn{display:block}.hm.sel>circle:not(.ring){stroke:var(--seal);stroke-width:3}
.lsp{fill:none;stroke:#cbc2b0;stroke-width:1.3}.lsp.trunk{stroke:var(--seal);stroke-width:3.5;stroke-opacity:.75}
.ln{cursor:pointer}.ln text{font-size:11px;fill:var(--mute)}.ln.alive text{fill:var(--ink)}.ln text.sub{font-size:9px;fill:var(--mute)}
.ln>circle:not(.ring){stroke:#fffdf8;stroke-width:1.5}.ln .ring{fill:none;stroke-width:2}.ln .ring.ego{stroke:var(--ink)}.ln .ring.head{stroke:var(--seal)}.ln.sel>circle:not(.ring){stroke:var(--seal);stroke-width:3}
.lhead{font-size:15px;font-weight:600;fill:var(--seal)}.lsub{font-size:11px;fill:var(--mute)}
.dring{fill:none;stroke:var(--line);stroke-width:1}.dring.zero{stroke:var(--seal);stroke-opacity:.35}
.dlab{font-size:11px;fill:var(--mute);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.wnode.inlaw circle.dot{stroke-dasharray:3 2}
.grid{stroke:#e5ddcd;stroke-width:1}.axislab{font-size:11px;fill:var(--mute)}.nowline{stroke:var(--seal);stroke-dasharray:4 4;stroke-width:1}
.lifesvg{display:block;margin:6px 12px;cursor:default}
.lifesvg .band{fill:#2f6f9f;fill-opacity:.06}
.lrow{cursor:pointer}.lrow .hit{fill:transparent}.lrow:hover .hit{fill:#00000008}.lrow.sel .hit{fill:#8c2f1b14}
.lrow .life{fill-opacity:.75;stroke-width:1}.lrow .life.est{fill-opacity:.25;stroke-dasharray:3 2}.lrow .life.open{fill-opacity:.2;stroke:none}
.lname{font-size:12px}.ghead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;fill:var(--seal);font-weight:600}
.cross{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}.crosslab{font-size:11px;font-weight:600}
.auth{padding:16px 18px}
.astats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{flex:1 1 170px;max-width:260px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card);position:relative;border-left:4px solid var(--line)}
.tile b{display:block;font-size:24px;font-family:Georgia,serif;line-height:1.1}.tile span{font-size:12.5px;color:var(--mute)}
.tile.warn{border-left-color:var(--strained)}.tile.bad{border-left-color:var(--broken)}.tile.ok{border-left-color:var(--kept)}.tile.ok b{color:var(--mute)}
.tile[onclick]{cursor:pointer}.tile[onclick]:hover{border-color:var(--ink)}.tile i{position:absolute;right:10px;top:8px;color:var(--mute);font-style:normal}
.topwrap{display:flex;justify-content:center}.topwrap .hcard{min-width:380px;max-width:760px}
.trunk{height:18px;border-left:2px solid var(--line);margin-left:50%}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;border-top:2px solid var(--line);padding-top:14px}
.hcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;border-top:4px solid #8d8473}
.hcard.top{border-top-color:var(--seal)}.hcard.mine{box-shadow:0 0 0 2px var(--ink)}.hcard.gone{border-top-color:var(--strained)}
.hcard.bad{border-top-color:var(--broken);background:#fbeeea;margin-top:14px}
.hcard .hhead{margin-bottom:6px}.hcard .hsub{font-size:12px;color:var(--mute);margin-top:6px}
.pchip.byright{border-color:var(--strained);background:#fbf0d6}.pchip.bound{border:1.5px dashed #2f6f9f}
.pchip.picked{outline:2px solid var(--seal)}
/* between circle */
.bcircle{display:block;width:100%;margin:6px auto 10px}
.bline{fill:none!important;cursor:pointer;stroke-opacity:.75}.bline:hover,.bline.on{stroke-opacity:1;filter:drop-shadow(0 0 2px #0004)}
.bline.s-unset{stroke:#b9b0a0}
td.cell.kept{background:#e9f2ec}td.cell.strained{background:#faf0dc}td.cell.broken{background:#f8e3df}td.cell.severed{background:#e2ddd6}
.house>.couple .tog{border:0;background:none;cursor:pointer;color:var(--mute);font-size:12px;padding:0 4px}
.house.shut>.kids{display:none}
aside{width:440px;max-width:46vw;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:16px 18px}
.page{flex:1;overflow:auto;padding:18px 22px}
svg text{font-family:system-ui,"Noto Sans KR",sans-serif;pointer-events:none}
.node{cursor:pointer}
.node rect{fill:var(--card);stroke:#8d8473;stroke-width:1.2}
.node.dead rect{fill:#ece6d9;stroke-dasharray:3 3}
.node.ego rect{fill:var(--ink);stroke:var(--ink)}
.node.ego text{fill:#fff}
.node.sel rect{stroke:var(--seal);stroke-width:3}
.node.st-entering rect{stroke:#2f6f9f;stroke-width:2.5;stroke-dasharray:6 4}
.node.st-estranged rect{stroke:#c98a1b;stroke-width:2.5;fill:#fbf0d6}
.node.st-outside rect{stroke:#8a8578;stroke-width:1.5;stroke-dasharray:2 3;fill:#f1efe9}
.node.st-cut_off rect{fill:#1d1b19;stroke:#1d1b19}.node.st-cut_off text{fill:#fff}.node.st-cut_off .nm{text-decoration:line-through}
.node .nm{font-size:13px;font-weight:600}
.node .rl{font-size:11px;fill:var(--mute)}
.node.ego .rl{fill:#d8cfbf}
.edge{fill:none;stroke-width:1.6}
.s-kept{stroke:var(--kept);fill:var(--kept)}.s-strained{stroke:var(--strained);fill:var(--strained)}
.s-broken{stroke:var(--broken);fill:var(--broken)}.s-severed{stroke:var(--severed);fill:var(--severed)}
.s-unset{stroke:var(--unset);fill:var(--unset)}
.edge.s-severed{stroke-dasharray:2 5}.edge.s-broken{stroke-dasharray:7 4}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
aside h2{font-size:21px}
.ko{font-family:"Noto Serif KR",serif;color:var(--seal)}
html[lang^="zh"] .brand-zi{display:none}
header #bgSel,header #langSel{font-size:13px;padding:4px 6px;max-width:132px;margin-left:6px}
header .find input{width:190px}
.about{font-size:15.5px;line-height:1.6}.about .lead{font-size:20px;font-weight:600}.about h3{margin:22px 0 4px}
.about dl{margin:8px 0}.about dt{font-weight:600;margin-top:10px}.about dd{margin:2px 0 0 0}
.rel{margin:6px 0 12px}
.rel b{font-weight:600}
.sect{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.sect>h3{font-size:16px;margin-bottom:4px}
.sphere{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 0 3px}
.duty{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dotted var(--line)}
.duty .t{flex:1}
.duty .src{display:block;font-size:12px;color:var(--mute)}
.duty.draft .t>span:first-child{font-style:italic;color:#5d564b}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.draft{border-style:dashed}.tag.confirmed{border-color:var(--kept);color:var(--kept)}.tag.retired{text-decoration:line-through}
.marks{display:flex;gap:2px;flex:none}
.marks button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;padding:0;color:var(--mute)}
.marks button.on.kept{background:var(--kept);border-color:var(--kept);color:#fff}
.marks button.on.failing{background:var(--broken);border-color:var(--broken);color:#fff}
.marks button.on.poorly{background:var(--strained);border-color:var(--strained);color:#fff}
.marks button.on.na{background:var(--unset);border-color:var(--unset);color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;background:#fff;font-size:13px}
.chip.on{color:#fff}
.chip.on.kept{background:var(--kept);border-color:var(--kept)}.chip.on.strained{background:var(--strained);border-color:var(--strained)}
.chip.on.broken{background:var(--broken);border-color:var(--broken)}.chip.on.severed{background:var(--severed);border-color:var(--severed)}
.note{width:100%;margin-top:4px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
table{border-collapse:collapse}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:#efe8da;font-weight:600}
td.cell{cursor:pointer;border-left:4px solid var(--unset)}
td.cell.kept{border-left-color:var(--kept)}td.cell.strained{border-left-color:var(--strained)}
td.cell.broken{border-left-color:var(--broken)}td.cell.severed{border-left-color:var(--severed)}
.cols{display:flex;gap:22px;align-items:flex-start}
.cols>div{flex:1;min-width:0}
.grp{font-family:Georgia,serif;font-size:16px;margin:16px 0 4px}
.hit{padding:8px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.hit b{display:block;font-size:13px}
.hit mark{background:#f3dc9c}
.hit .full{white-space:pre-wrap;font-size:13px;margin-top:6px;display:none}
.hit.open .full{display:block}.hit.open .snip{display:none}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex;width:220px}
.bar i{display:block;height:100%}
dialog{border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:560px;max-width:94vw;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0005}
dialog label{display:block;font-size:12px;color:var(--mute);margin-top:8px}
dialog input[type=text],dialog select,dialog textarea{width:100%}
.err{color:var(--broken);font-size:13px;min-height:18px}
.st-entering{--st:#2f6f9f}.st-estranged{--st:#c98a1b}.st-cut_off{--st:#1d1b19}.st-outside{--st:#8a8578}
.badge{font-size:10px;border-radius:3px;padding:0 5px;color:#fff;background:var(--st,#7a7265);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.wnode{cursor:pointer}
.wnode circle.dot{fill:var(--card);stroke:#6f675a;stroke-width:1.5}
.wnode.dead circle.dot{fill:#d9d0bf;stroke-dasharray:2 2}
.wnode.st-outside circle.dot{fill:#f1efe9;stroke:#8a8578;stroke-dasharray:2 2}
.pchip.st-outside{border:1px dashed #8a8578;opacity:.85}
.wnode.st-entering circle.dot{fill:#fff;stroke:#2f6f9f;stroke-width:2.5;stroke-dasharray:4 3}
.wnode.st-estranged circle.dot{fill:#f2d9a3;stroke:#c98a1b;stroke-width:2.5}
.wnode.st-cut_off circle.dot{fill:#1d1b19;stroke:#1d1b19}
.wnode.sel circle.dot{stroke:var(--seal);stroke-width:4}
.wnode .nm{font-size:12px;font-weight:600}.wnode .rl{font-size:10.5px;fill:var(--mute)}
.wnode.st-cut_off .nm{text-decoration:line-through}
.spoke{stroke-width:2.6;fill:none;stroke-linecap:round}
.ring{fill:none;stroke:var(--line);stroke-dasharray:2 6}
.house{border:1px solid var(--line);border-radius:10px;margin:4px 0;padding:7px 9px;background:rgba(90,60,10,.035)}
.house>.kids{margin:7px 0 0 20px}
.couple{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kids{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-start}
.kids>.house{flex-basis:100%}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #8d8473;border-radius:6px;padding:2px 8px;background:var(--card);cursor:pointer;line-height:1.25}
.pchip.f{border-radius:14px}
.pchip small{color:var(--mute);font-size:11px}
.pchip.dead{background:#ece6d9;border-style:dotted;color:#6d665a}
.pchip.st-entering{border:2px dashed #2f6f9f}
.pchip.st-estranged{border:2px solid #c98a1b;background:#fbf0d6}
.pchip.st-cut_off{background:#1d1b19;border-color:#1d1b19;color:#fff}
.pchip.st-cut_off b{text-decoration:line-through}.pchip.st-cut_off small{color:#cfc7b8}
.pchip.is-ego{outline:3px solid var(--seal);outline-offset:1px}
.pchip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.wed{color:var(--mute);font-size:12px}
details.dx>summary{list-style:none;cursor:pointer}details.dx>summary::-webkit-details-marker{display:none}
details.dx>summary::before{content:"▸";display:inline-block;width:1em;color:var(--mute);transition:transform .12s}
details.dx[open]>summary::before{transform:rotate(90deg)}
details.dx>.src,details.dx>.prov,details.dx>.whynot{margin-left:1em}details.dx>.src{display:block;margin-top:3px}
.prov{font-size:12.5px;margin-top:3px}.prov summary{cursor:pointer;color:var(--seal)}
.prov div{margin:3px 0 3px 0}.prov q{display:block;color:var(--mute);font-style:italic;margin-left:8px}
.prov .ptrad{margin:6px 0 4px 0}.prov .ptrad>div{margin:2px 0 2px 10px}.prov details summary{color:var(--mute);margin-left:10px;font-size:12px}
.ruling .rsec{margin-top:12px}.ruling .rhead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.ruling .ground{margin:6px 0 10px}.ruling blockquote{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--seal);background:#f4efe6;font-family:Georgia,serif;font-size:14px}
.ruling blockquote cite{display:block;font-family:system-ui,sans-serif;font-style:normal;font-size:12px;color:var(--mute);margin-top:4px}

<body>

<main id="tab-stand" class="on">

      <span class="seg" title="how to draw the people around you" data-i18n-attr="title"><button id="v_web" onclick="setView('web')" title="a spoke to each relation" data-i18n data-i18n-attr="title">Web</button><button id="v_rings" onclick="setView('rings')" title="rings by degree of kinship" data-i18n data-i18n-attr="title">Degrees</button><button id="v_tree" onclick="setView('tree')" title="rows by generation" data-i18n data-i18n-attr="title">Tree</button><button id="v_fan" onclick="setView('fan')" title="ancestors above, descendants below" data-i18n data-i18n-attr="title">Fan</button><button id="v_duties" onclick="setView('duties')" title="what you owe each person, by sphere" data-i18n data-i18n-attr="title">Duties</button></span>

<script>
/* Phones get /m. The server decides from the browser's name; this catches a small touch screen it missed.
   Choosing "full site" on the phone view sets way_ui=full, and /full always shows this page. */
(() => {
  const touch = matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0, small = Math.min(screen.width, screen.height) < 600;
  if (location.pathname === "/" && touch && small && !/(^|;\s*)way_ui=full/.test(document.cookie)) location.replace("/m" + location.hash);
  if (touch) document.getElementById("phoneBtn").hidden = false;     // the header is already parsed
})();

<script>
"use strict";
let S = null, E = null, egoId = null, sel = null, reach = "close", examine = false;
let recenter = true, view = localStorage.getItem("way-view") || "web", mapRoot = null, mapLiving = true;
let betweenIds = [], betweenCell = null, betweenAuto = null, betweenCleared = false, wayFilter = {from: "", trad: "", status: "", text: ""}, libQ = "", libHits = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const P = id => S.people[id];
const nm = id => P(id) ? P(id).name : "?";
const yr = p => (p.birth || "").slice(0, 4);
const life = p => (yr(p) || p.death) ? `${yr(p) || "?"}–${p.death ? (p.death === "?" ? "" : p.death.slice(0, 4)) : ""}` : "";
/* where a duty is recorded: its own tradition first, then every attestation */
const recorded = d => [{tradition: d.tradition, citation: d.citation}, ...(d.attest || [])];
const tradsOf = d => [...new Set(recorded(d).map(a => a.tradition))];
const alsoIn = d => { const ts = tradsOf(d).filter(x => x !== d.tradition); return ts.length ? ` · <span title="${esc((d.attest || []).map(a => t(S.meta.traditions[a.tradition] || a.tradition) + ": " + a.citation).join("\n"))}">${t("also {list}", {list: ts.map(x => esc(t(S.meta.traditions[x] || x))).join(", ")})}</span>` : ""; };
function provenance(d) {            // every place the duty is recorded, each with its words
  if (!(d.attest || []).length) return "";
  const order = Object.keys(S.meta.traditions), rank = x => order.includes(x) ? order.indexOf(x) : 99;
  const by = {};
  recorded(d).forEach(a => (by[a.tradition] = by[a.tradition] || []).push(a));
  const one = a => `<div>${esc(a.citation)}${a.quote ? `<q>${esc(a.quote)}</q>` : ""}</div>`;
  const n = recorded(d).length, ts = Object.keys(by).sort((a, b) => rank(a) - rank(b));
  return `<div class="prov"><div class="mute">${ts.length > 1 ? t("Recorded in {n} traditions", {n: ts.length}) : t("Recorded in {n} tradition", {n: ts.length})}${n > ts.length ? ` · ${t("{n} places", {n})}` : ""}</div>${ts.map(tr =>   // weightiest first
    `<div class="ptrad"><b>${esc(t(S.meta.traditions[tr] || tr))}</b>${by[tr].length > 1 ? ` (${by[tr].length})` : ""}${by[tr].slice(0, 3).map(one).join("")}${by[tr].length > 3
      ? `<details><summary>${t("{n} more", {n: by[tr].length - 3})}</summary>${by[tr].slice(3).map(one).join("")}</details>` : ""}</div>`).join("")}</div>`;
}
/* a duty shows only its words; the arrow opens where it comes from */
const dutyText = (d, src) => `<details class="dx"><summary>${esc(dtext(d))}</summary><div class="src">${src}</div>${provenance(d)}${d.status === "retired" ? whyNot(d) : ""}</details>`;
const whyNot = d => d.reason || d.counter ? `<div class="whynot"><b>${t("Why we do not keep this.")}</b> ${esc(d.reason)}${d.counter ? `<div class="mute" style="margin-top:3px">${t("Against it: {text}", {text: esc(d.counter)})}</div>` : ""}</div>` : "";
const markLabel = s => s === "poorly" ? t("not doing well") : s === "na" ? t("does not apply") : s === "kept" ? t("kept") : s === "failing" ? t("failing") : s;
const dead = p => p.living === undefined ? !!p.death : !p.living;   // the server decides who is living

const READONLY_MSG = () => t("This is a read-only demonstration of The Way with an example family. Download it to keep your own family's record.");
window.alert = (a => m => { if (m !== "read-only") a(m); })(window.alert.bind(window));   // the refusal is said once
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.message === "read-only") e.preventDefault(); });
async function api(method, path, body) {
  if (method !== "GET" && typeof S !== "undefined" && S && S.read_only) { alert(READONLY_MSG()); throw new Error("read-only"); }
  const r = await fetch(path, {method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function loadState() {
  const s = await api("GET", "/api/state");
  s.people = Object.fromEntries(s.people.map(p => [p.id, p]));
  s.duties = Object.fromEntries(s.duties.map(d => [d.id, {...d, attest: []}]));
  for (const a of s.attest || []) if (s.duties[a.duty_id]) s.duties[a.duty_id].attest.push(a);
  S = s;
  chrome();
}
function chrome() {                 // the header's selects and the banners, in the reader's language
  document.title = t("The Way");
  const bs = document.getElementById("bgSel");
  if (bs) bs.innerHTML = Object.entries(S.backgrounds || {}).map(([k, v]) => `<option value="${k}"${k === S.background ? " selected" : ""}>${t(v)}</option>`).join("");
  const ls = document.getElementById("langSel");
  if (ls) ls.innerHTML = langOptions();
  const ex = document.getElementById("ex-banner");
  if (S.mode === "example" && !ex) document.body.insertAdjacentHTML("afterbegin", `<div id="ex-banner" style="background:#f3ead7;border-bottom:1px solid #d9c9a3;text-align:center;padding:6px 12px;font-size:13px">
    ${t("An example family. Switch the background at the top to see a Korean, Chinese or Anglo family, or a mix.")}${S.read_only ? "" : ` <button class="btn sm" onclick="startOwn()">${t("Start your own family")}</button>`}</div>`);
  if (S.mode !== "example" && ex) ex.remove();
  if (S.read_only && !document.getElementById("ro-banner")) document.body.insertAdjacentHTML("afterbegin",
    `<div id="ro-banner" style="background:#7a2a1a;color:#fff;text-align:center;padding:6px 12px;font-size:13px">${t("Read-only demonstration with an example family. Nothing here can be changed.")}</div>`);
}
async function loadEgo() {
  if (egoId == null || !P(egoId)) { E = null; return; }
  E = await api("GET", "/api/ego/" + egoId);
}
/* the family's background: in the examples it picks which example family is shown; in a family's own record it is a setting */
async function setBackground(bg) {
  if (S.mode === "example") { document.cookie = "way_bg=" + bg + "; path=/; max-age=31536000; samesite=lax"; egoId = null; E = null; sel = null; localStorage.removeItem("way-ego"); history.replaceState(null, "", location.pathname); await loadState(); await fromHash(); return; }
  try { await api("PUT", "/api/setting", {key: "background", value: bg}); await refresh(); } catch (e) { alert(e.message); }
}
async function startOwn() {
  if (!confirm(t("Start your own family's record? It begins empty; add yourself first with + Person, then your parents, spouse and children. The example families stay out of it."))) return;
  try { await api("POST", "/api/own", {background: S.background}); egoId = null; E = null; sel = null; localStorage.removeItem("way-ego"); history.replaceState(null, "", location.pathname); await loadState(); await fromHash(); } catch (e) { alert(e.message); }
}
async function refresh() { await loadState(); await loadEgo(); render(); }
async function standAs(id) {
  egoId = id; sel = null; examine = false; recenter = true;
  localStorage.setItem("way-ego", id);
  await loadEgo(); showTab("stand"); render();
}
function render() {
  const tab = document.querySelector("nav button.on").dataset.tab;
  if (tab === "stand") { draw(); panel(); }
  if (tab === "map") drawMap();
  if (tab === "atlas") drawAtlas();
  if (tab === "between") drawBetween();
  if (tab === "way") drawWay();
  if (tab === "rulings") drawRulings();
  if (tab === "clan") drawClan();
  if (tab === "about") $("#about").innerHTML = `<div class="card">${aboutHTML()}</div>`;
  syncHash();
}
function syncHash() {              // keep the address a deep link to what is on screen
  const tab = document.querySelector("nav button.on").dataset.tab, h = new URLSearchParams();
  if (egoId != null) h.set("ego", egoId);
  if (tab !== "stand") h.set("tab", tab);
  if (tab === "stand") { if (sel) h.set("sel", sel); if (view !== "web") h.set("view", view); if (reach === "wide") h.set("reach", "wide"); }
  if (tab === "atlas") { h.set("av", atlasView); if (atlasSel != null) h.set("sel", atlasSel); }
  const s = "#" + h.toString();
  if (location.hash !== s) history.replaceState(null, "", s);
}
function showTab(t) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll("main").forEach(m => m.classList.toggle("on", m.id === "tab-" + t));
}
$("#nav").onclick = e => { if (e.target.dataset.tab) { showTab(e.target.dataset.tab); render(); } };

/* ---------- people search ---------- */
function matches(text, limit = 14) {
  const t = text.trim().toLowerCase();
  if (!t) return [];
  return Object.values(S.people).filter(p => (p.name + " " + (p.ko_name || "")).toLowerCase().includes(t))
    .sort((a, b) => (dead(a) - dead(b)) || a.name.localeCompare(b.name)).slice(0, limit);
}
function attachFinder(input, drop, onPick) {
  const show = () => {
    const m = matches(input.value);
    drop.hidden = !m.length;
    drop.innerHTML = m.map(p => `<div data-id="${p.id}"><span>${esc(p.name)}</span><small>${esc(life(p))}</small></div>`).join("");
  };
  input.oninput = show; input.onfocus = show;
  drop.onmousedown = e => {
    const d = e.target.closest("[data-id]");
    if (d) { e.preventDefault(); input.value = ""; drop.hidden = true; onPick(+d.dataset.id); }
  };
  input.onblur = () => setTimeout(() => drop.hidden = true, 150);
}
attachFinder($("#q"), $("#qdrop"), standAs);
$("#meBtn").onclick = () => S.me && P(S.me) ? standAs(S.me) : alert(t("Stand as yourself first, then press “This is me” in the side panel."));

/* ---------- stand-here tree ---------- */
const CLOSE = new Set(["P", "PP", "S", "PC", "C", "CC", "CS", "SP", "PS", "SC", "X", "K", "Q", "PSC"]);
const WIDE = new Set([...CLOSE, "PPC", "PPCS", "PPCC", "PCS", "PCC", "PCCS", "SPC", "SPCS", "SPCC", "PPP", "CCC", "CCS", "SPP", "CSP"]);
const SEV = {kept: 1, strained: 2, broken: 3, severed: 4};
function toggleReach() { reach = reach === "close" ? "wide" : "close"; $("#reachBtn").textContent = reach === "close" ? t("Wider") : t("Closer"); recenter = true; draw(); if (!sel) panel(); }
function shown() {
  const set = reach === "close" ? CLOSE : WIDE, showDead = $("#showDead").checked, out = [];
  for (const [id, r] of Object.entries(E.rels)) {
    if (!set.has(r.them.path)) continue;
    if (!showDead && dead(P(id))) continue;
    out.push(+id);
  }
  return out;
}
function rank(id) {
  const r = E.rels[id].them, p = r.path, mat = (r.qual || "").startsWith("mat"), f = P(id).sex === "f";
  if (p === "P") return f ? 4 : 3;
  if (p === "PP" || p === "PPP") return mat ? 6 : 1;
  if (p === "PPC") return mat ? 6.5 : 1;
  if (p === "PPCC") return mat ? 9 : 0;
  return ({PS: 5, SP: 8, SPP: 9, CSP: 9.5, PC: 2, PSC: 2.5, S: 5, X: 5.5, K: 5.6, Q: 5.7, SPC: 7, C: 3, SC: 4, PCC: 1, SPCC: 6, CC: 3, CCC: 3})[p] ?? 10;
}
function bondBetween(a, b) {
  let worst = null;
  for (const x of E.bonds) if ((x.a === a && x.b === b) || (x.a === b && x.b === a)) if (!worst || SEV[x.state] > SEV[worst]) worst = x.state;
  return worst || "unset";
}
function layout(ids, W, H, GAPX, GAPY) {
  const rows = {};
  const isSpouseNode = id => { const p = E.rels[id].them.path; return p.endsWith("S"); };
  for (const id of ids) (rows[E.rels[id].them.gen] ||= []).push(id);
  (rows[0] ||= []).push(egoId);
  const pos = {}, gens = Object.keys(rows).map(Number).sort((a, b) => b - a);
  let maxN = 1;
  for (const g of gens) {
    const key = id => id === egoId ? [2, P(id).birth || "9999"] : [rank(id), P(id).birth || "9999"];
    const base = rows[g].filter(id => id === egoId || !isSpouseNode(id)).sort((a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1].localeCompare(y[1]) || a - b; });
    for (const id of rows[g].filter(id => id !== egoId && isSpouseNode(id))) {
      const i = base.indexOf(E.rels[id].via);
      if (i >= 0) base.splice(i + 1, 0, id); else base.push(id);
    }
    rows[g] = base; maxN = Math.max(maxN, base.length);
  }
  const width = Math.max(maxN * (W + GAPX) + GAPX, 700);
  gens.forEach((g, ri) => rows[g].forEach((id, i) => {
    pos[id] = {x: width / 2 + (i - (rows[g].length - 1) / 2) * (W + GAPX) - W / 2, y: 20 + ri * (H + GAPY)};
  }));
  return {pos, width, height: 40 + gens.length * (H + GAPY) - GAPY};
}
function edges(pos, W, H) {
  let s = "";
  for (const u of S.unions) {
    const a = pos[u.a_id], b = pos[u.b_id];
    if (!a || !b) continue;
    const [l, r] = a.x < b.x ? [a, b] : [b, a];
    const cls = "edge s-" + bondBetween(u.a_id, u.b_id), dash = u.status === "divorced" ? ' stroke-dasharray="2 4"' : "";
    if (l.y === r.y) s += `<path class="${cls}"${dash} style="fill:none" d="M${l.x + W} ${l.y + H / 2 - 3}H${r.x}M${l.x + W} ${l.y + H / 2 + 3}H${r.x}"/>`;
    else s += `<path class="${cls}"${dash} style="fill:none" d="M${l.x + W / 2} ${l.y + H}L${r.x + W / 2} ${r.y}"/>`;
  }
  const kids = {};
  for (const k of S.links) if (pos[k.parent_id] && pos[k.child_id]) (kids[k.child_id] ||= []).push(k.parent_id);
  for (const [c, ps] of Object.entries(kids)) {
    const b = pos[c], x2 = b.x + W / 2, y2 = b.y;
    const pair = ps.length === 2 && pos[ps[0]].y === pos[ps[1]].y && Math.abs(pos[ps[0]].x - pos[ps[1]].x) < 2.5 * W;
    const from = pair ? [{x: (pos[ps[0]].x + pos[ps[1]].x + W) / 2, y: pos[ps[0]].y + H / 2 + 3, st: [bondBetween(ps[0], +c), bondBetween(ps[1], +c)].sort((p, q) => (SEV[q] || 0) - (SEV[p] || 0))[0]}]
      : ps.map(p => ({x: pos[p].x + W / 2, y: pos[p].y + H, st: bondBetween(p, +c)}));
    for (const f of from) { const m = (Math.max(f.y, pos[ps[0]].y + H) + y2) / 2;
      s += `<path class="edge s-${f.st}" style="fill:none" d="M${f.x} ${f.y}V${m}H${x2}V${y2}"/>`; }
  }
  return s;
}
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const VIEWS = ["web", "rings", "tree", "fan", "duties"];
function setView(v) { view = v; localStorage.setItem("way-view", v); recenter = true; draw(); syncHash(); }
function draw() {
  if (!VIEWS.includes(view)) view = "web";
  for (const v of VIEWS) $("#v_" + v).classList.toggle("on", view === v);
  const box = $("#tree");
  box.classList.toggle("scroll", view === "duties");
  $("#reachBtn").hidden = $("#deadBox").hidden = view === "fan";
  $("#reachBtn").textContent = reach === "close" ? t("Wider") : t("Closer");
  if (!E) { box.innerHTML = welcome(); $("#lensbar").innerHTML = ""; return; }
  const ids = view === "web" ? drawRadial() : view === "rings" ? drawRadial(true) : view === "tree" ? drawTree() : view === "fan" ? drawFan() : drawDuties();
  $("#lensbar").innerHTML = view === "duties" ? "" : lensControls(ids || [], "stand") + (view === "rings" ? `<div class="mute" style="font-size:12px;margin-top:4px">${t("Each ring is a degree of kinship: one for every step up to a common ancestor and down again. A husband or wife has no degree and sits beside you. In-laws (dashed) take the degree of the one through whom they come.")}</div>` : "");
}

async function addKin(id, existing) {
  try {
    const type = $("#k_type").value;
    const parents = S.links.filter(l => l.child_id === id).map(l => l.parent_id);
    if (type === "sibling" && !parents.length) throw new Error(t("Add a parent first; siblings are those who share one."));
    let kid = existing;
    if (!kid) {
      const name = $("#k_name").value.trim();
      if (!name) throw new Error(t("Type a name."));
      kid = (await api("POST", "/api/person", {name, sex: $("#k_sex").value, birth: $("#k_birth").value.trim()})).id;
    }
    if (type === "parent") await api("POST", "/api/link", {parent_id: kid, child_id: id});
    if (type === "spouse") await api("POST", "/api/union", {a_id: id, b_id: kid});
    if (type === "sibling") for (const p of parents) await api("POST", "/api/link", {parent_id: p, child_id: kid});
    if (type === "child") {
      await api("POST", "/api/link", {parent_id: id, child_id: kid});
      const sp = S.unions.filter(u => (u.a_id === id || u.b_id === id) && !["divorced", "paramour"].includes(u.status)).map(u => u.a_id === id ? u.b_id : u.a_id);
      if ($("#k_both").checked && sp.length === 1) await api("POST", "/api/link", {parent_id: sp[0], child_id: kid});

  } catch (e) { fail(e); }
}

/* ---------- family map: houses nested inside houses, no lines to cross ---------- */
function openToward(id) {            // my roles and duties toward this person
  const from = S.me && P(S.me) ? S.me : egoId;
  if (from == null || from === id) return standAs(id);
  standAs(from).then(() => { if (E.rels[id]) { sel = id; draw(); panel(); } else standAs(id); });
}
function drawMap() {
  const el = $("#map");
  if (!Object.keys(S.people).length) { el.innerHTML = welcome(); return; }
  const kidsOf = {}, parentsOf = {}, spousesOf = {};
  for (const l of S.links) { (kidsOf[l.parent_id] ||= []).push(l.child_id); (parentsOf[l.child_id] ||= []).push(l.parent_id); }
  for (const u of S.unions) { (spousesOf[u.a_id] ||= []).push([u.b_id, u.status]); (spousesOf[u.b_id] ||= []).push([u.a_id, u.status]); }
  // roots on offer: the ancestors of whoever we are standing as
  const anc = [], seenA = new Set();
  const climb = (id, label, d) => { if (seenA.has(id) || d > 4) return; seenA.add(id); anc.push([id, label, d]);
    for (const p of parentsOf[id] || []) climb(p, d ? (P(p).sex === "f" ? t("{rel}’s mother", {rel: label}) : t("{rel}’s father", {rel: label})) : (P(p).sex === "f" ? t("mother") : t("father")), d + 1); };
  const base = egoId ?? S.me;
  if (base != null && P(base)) climb(base, "", 0);
  if (mapRoot == null || !P(mapRoot)) {            // default: up the father's line, three generations
    let r = base; for (let i = 0; r != null && i < 3; i++) { const f = (parentsOf[r] || []).find(p => P(p).sex === "m") ?? (parentsOf[r] || [])[0]; if (f == null) break; r = f; }
    mapRoot = r ?? +Object.keys(S.people)[0];
  }
  const alive = {}, hasLiving = id => alive[id] ??= (alive[id] = false, !dead(P(id)) || (kidsOf[id] || []).some(hasLiving));
  const shownSet = new Set();
  const chip = id => { const p = P(id), r = E && E.rels[id]; shownSet.add(id);
    return `<span class="pchip ${p.sex === "f" ? "f" : ""}${dead(p) ? " dead" : ""}${standing(p) ? " st-" + standing(p) : ""}${id === egoId ? " is-ego" : ""}" onclick="openToward(${id})" title="${esc(p.name)} ${esc(life(p))}${r ? " — " + t("{name}’s {rel}", {name: esc(nm(egoId)), rel: esc(r.them.en)}) : ""}">
      <i style="background:${lensColor(id)}"></i><b style="font-weight:600">${esc(p.name)}</b>
      <small>${r ? esc(native(r.them).split(" (")[0] || r.them.en.split(" (")[0]) : esc(yr(p))}</small>${id === theHead() ? ` <span class="badge" style="background:var(--seal)">${t("Head of the family")}</span>` : isHouseHead(id) ? ` <small style="color:var(--seal);font-weight:600">${t("head")}</small>` : ""}${standing(p) ? ` <small>${esc(t(S.meta.standings[standing(p)]))}</small>` : ""}${p.headship && !dead(p) ? ` <small style="color:var(--broken)">${esc(t(S.meta.headship[p.headship]))}</small>` : ""}</span>`; };
  const done = new Set();
  const house = (id, d) => {
    if (done.has(id)) return chip(id);
    done.add(id);
    const sp = (spousesOf[id] || []).filter(([x]) => !mapLiving || !dead(P(x)) || !dead(P(id)) || (kidsOf[x] || []).some(hasLiving));
    let ks = [...new Set(kidsOf[id] || [])].filter(k => !mapLiving || hasLiving(k)).sort((a, b) => (P(a).birth || "9999").localeCompare(P(b).birth || "9999"));
    sp.forEach(([x]) => done.add(x));
    const wed = st => st === "paramour" ? `<span class="wed" title="${t("paramour: living together, unmarried")}">≈</span>` : `<span class="wed" title="${esc(t(st))}">${st === "divorced" ? "⚮" : "⚭"}</span>`;
    // the man stands first in his house, whichever of the two is the blood relative
    const man = P(id).sex !== "m" && sp.length === 1 && P(sp[0][0]).sex === "m" && !["divorced", "paramour"].includes(sp[0][1]);
    const pair = man ? chip(sp[0][0]) + wed(sp[0][1]) + chip(id) : chip(id) + sp.map(([x, st]) => wed(st) + chip(x)).join("");
    if (!ks.length) return d ? pair : `<div class="couple">${pair}</div>`;
    const below = new Set(), walk = k => { if (below.has(k)) return; below.add(k); (kidsOf[k] || []).forEach(walk); }; ks.forEach(walk);
    const shut = mapShut.has(id);
    const head = `<div class="couple">${pair}<button class="tog" title="${shut ? t("open this house") : t("fold this house")}" onclick="toggleHouse(${id})">${shut ? "▸ " + t("{n} within", {n: below.size}) : "▾"}</button></div>`;
    if (shut) { for (const k of below) shownSet.delete(k); return `<div class="house d${d} shut">${head}</div>`; }
    const leaf = k => !(kidsOf[k] || []).some(c => !mapLiving || hasLiving(c));
    return `<div class="house d${d}">${head}<div class="kids">${ks.map(k => leaf(k) ? `<span class="couple">${house(k, d + 1)}</span>` : house(k, d + 1)).join("")}</div></div>`;
  };
  const body = house(mapRoot, 0);
  const counts = {}; for (const id of shownSet) { const k = dead(P(id)) ? "dead" : (standing(P(id)) || "member"); counts[k] = (counts[k] || 0) + 1; }

/* the living nearest to whoever you stand as: husband or wife, parents, children, brothers and sisters */

async function saveMatter(id) {

/* what is missing in the record: the headship and duty logic is only as good as these */
function missingCard() {
  const Y = new Date().getFullYear(), parents = {};
  for (const l of S.links) (parents[l.child_id] ||= []).push(l.parent_id);
  const people = Object.values(S.people).filter(p => (p.standing || "member") !== "outside");
  const fam = people.filter(p => !dead(p) && ofFamily(p.id));
  const forebears = new Set();                           // every living member's forebears to the fourth generation
  for (const p of fam) { let gen = [p.id]; for (let i = 0; i < 4; i++) { gen = gen.flatMap(x => parents[x] || []); gen.forEach(x => forebears.add(x)); } }
  const groups = [
    [t("Placeholders to name"), t("a stand-in added until the real person is known"), people.filter(p => /placeholder|not yet known/i.test(p.notes || "") || /^(husband|wife|child|son|daughter)( \d+)? of |^\(unnamed\)$/i.test(p.name))],
    [t("No birth year"), t("decides who is a minor, who is aged, and how brothers-in-law rank"), fam.filter(p => !yr(p))],
    [t("Sex not recorded"), t("decides headship and many roles"), people.filter(p => !p.sex || p.sex === "u")],
    [t("Died, date unknown"), t("recorded as dead with no date"), people.filter(p => p.death === "?")],
    [t("Minors with no guardian named"), t("who takes them if their parents die"), fam.filter(p => +yr(p) && Y - +yr(p) < 18 && !p.guardian_id)],
    [t("Forebears whose grave is not recorded"), t("within four generations of a living member"), [...forebears].map(P).filter(p => p && dead(p) && !(p.burial || "").trim())],
  ].filter(g => g[2].length);
  if (!groups.length) return `<div class="card"><h3>${t("What is missing")}</h3><p class="mute">${t("Nothing: every record the logic depends on is filled in.")}</p></div>`;
  return `<div class="card"><h3>${t("What is missing")}</h3><p class="mute" style="margin:4px 0 8px;font-size:13px">${t("The headship, roles and duties are worked out from these records. Click a name to fill it in.")}</p>
    ${groups.map(([title, why, ps]) => `<details><summary><b>${esc(title)}</b> (${ps.length}) <span class="mute">· ${esc(why)}</span></summary><div style="margin:6px 0 8px 14px">${ps.sort((a, b) => a.name.localeCompare(b.name)).map(p => `<a href="#" onclick="personDialog(${p.id});return false">${esc(p.name)}</a>${yr(p) ? ` <span class="mute">(${esc(life(p))})</span>` : ""}`).join(" · ")}</div></details>`).join("")}</div>`;
}

function drawRulings() {

  const house = r => `<div class="card ruling" id="ruling${r.id}">

    <div class="row" style="margin-top:8px">
      <select id="ract${r.id}">${["keep", "revise", "retire"].map(a => `<option value="${a}"${r.action === a ? " selected" : ""}>${t(a)}</option>`).join("")}</select>
      <button class="btn pri" onclick="decideRuling(${r.id},'accepted')">${t("Apply")}</button>

      <button class="btn" onclick="decideRuling(${r.id},'revise')">${t("Needs work")}</button></div></div>`;
  const card = r => r.category === "house" || r.category === "review" ? house(r) : `<div class="card ruling" id="ruling${r.id}">

    <div class="row"><select onchange="rulingFilter.status=this.value;drawRulings()">${opt(RST, rulingFilter.status, t("every decision"))}</select>
      <select onchange="rulingFilter.cat=this.value;drawRulings()">${opt(RCAT, rulingFilter.cat, t("every kind"))}</select>
      <span class="mute">${t("{n} awaiting your word", {n: n("proposed")})} · ${t("{n} accepted", {n: n("accepted")})} · ${t("{n} kept", {n: n("kept")})} · ${t("{n} need work", {n: n("revise")})} · ${t("{n} shown", {n: list.length})}</span></div></div>
    ${list.map(card).join("") || `<p class="mute">${all.length ? t("Nothing here.") : t("No rulings yet: they arrive when the sources are mined.")}</p>`}`;
}
async function decideRuling(id, status) {
  try {
    const body = {status, resolution: $("#rres" + id).value, note: $("#rnote" + id).value};
    if ($("#rrev" + id)) { body.revision = $("#rrev" + id).value; body.action = $("#ract" + id).value; }
    await api("PUT", "/api/ruling/" + id, body);
    await loadState(); await loadEgo(); drawRulings();
  } catch (e) { alert(e.message); }
}

    <h2>${t("Your place")}</h2><div>${ids.map(id => `${esc(nm(id))} (${esc(E.rels[id].them.en.split(" (")[0])}${native(E.rels[id].them) ? ", " + esc(native(E.rels[id].them)) : ""})`).join(" · ")}</div>
    ${collective ? `<h2>${t("To the house and the clan")}</h2>${collective}` : ""}
    ${ids.map(id => { const r = E.rels[id], a = plain(r.owe, r.marks_out), b = plain(r.owed, r.marks_in);
      if (!a && !b) return "";
      return `<h2>${t("{name}, your {rel}", {name: esc(nm(id)), rel: esc(r.them.en.split(" (")[0])})}${withMarks && r.bond_out ? ` <small>${t("[bond: {state}]", {state: t(r.bond_out.state)})}</small>` : ""}</h2>${a ? `<div><i>${t("You owe:")}</i></div>${a}` : ""}${b ? `<div><i>${t("You are owed:")}</i></div>${b}` : ""}`; }).join("")}`;
  if (!$("#sheet").querySelector(".duty")) alert(t("No confirmed duties apply yet. Only confirmed duties are printed; confirm them in The Way first."));
  else window.print();
}

/* a head's charge: who is under his headship and in his care, with room for notes, to print */
function printCharge(id) {
  if (!E || egoId !== id) return alert(t("Stand as this person first."));
  const me = P(id), living = Object.values(S.people).filter(p => !dead(p) && p.id !== id && ofFamily(p.id)), top = theHead();
  const rel = k => E.rels[k] ? E.rels[k].them.en.split(" (")[0] : "";
  const near = (a, b) => (E.rels[a].them.path.length - E.rels[b].them.path.length) || ((P(a).birth || "9") < (P(b).birth || "9") ? -1 : 1);
  const age = p => { const y = +yr(p); return y ? `${y}${y > new Date().getFullYear() - 18 ? " · " + t("minor") : ""}` : ""; };
  const stand = p => [p.standing && p.standing !== "member" ? t(S.meta.standings[p.standing] || p.standing) : "", p.headship ? t(S.meta.headship[p.headship]) : ""].filter(Boolean).join(" · ");
  const row = (k, extra) => { const p = P(k);
    return `<tr><td><b>${esc(p.name)}</b>${p.ko_name ? " " + esc(p.ko_name) : ""}<div class="small">${esc([rel(k), age(p), stand(p)].filter(Boolean).join(" · "))}</div>${extra ? `<div class="small">${extra}</div>` : ""}</td><td class="notes"></td></tr>`; };
  const table = (ids, extra) => `<table class="charge"><tr><th>${t("Who")}</th><th>${t("Notes")}</th></tr>${ids.sort(near).map(k => row(k, extra && extra(k))).join("")}</table>`;
  const bound = living.filter(p => S.bound[p.id] && S.bound[p.id].by === id).map(p => p.id);
  const house = living.filter(p => S.heads[p.id] === id && !bound.includes(p.id)).map(p => p.id);
  const carried = living.filter(p => p.carried_by === id && !house.includes(p.id) && !bound.includes(p.id)).map(p => p.id);
  const actingFor = k => k in S.heads_right && S.heads_right[k] != null && S.heads_right[k] !== id ? `${t("acting in the place of {name}", {name: esc(nm(S.heads_right[k]))})}${P(S.heads_right[k]).headship ? " (" + esc(t(S.meta.headship[P(S.heads_right[k]).headship])) + ")" : ""}` : "";
  const headsUnder = id === top ? living.filter(p => S.heads[p.id] === p.id).map(p => p.id) : [];
  const leftToHead = id === top ? living.filter(p => S.heads[p.id] == null).map(p => p.id) : [];
  const memberCount = k => living.filter(p => S.heads[p.id] === k && p.id !== k).length;
  const above = [S.heads[id] != null && S.heads[id] !== id ? t("the head of your house, {name}", {name: esc(nm(S.heads[id]))}) : "", top != null && top !== id ? t("the Head of the family, {name}", {name: esc(nm(top))}) : ""].filter(Boolean);
  if (!house.length && !bound.length && !carried.length && !headsUnder.length && !leftToHead.length)
    return alert(me.sex === "f" ? t("No one is under {name}'s headship or in her care.", {name: me.name}) : t("No one is under {name}'s headship or in his care.", {name: me.name}));
  $("#sheet").innerHTML = `<h1>${t("{name}: those in your charge", {name: esc(me.name) + (me.ko_name ? " " + esc(me.ko_name) : "")})}</h1>
    <div class="small">${id === top ? t("Head of the family") + " · " : ""}${S.heads[id] === id ? t("head of his own house") + " · " : ""}${above.length ? (above.length > 1 ? t("You answer to {a} and {b}", {a: above[0], b: above[1]}) : t("You answer to {a}", {a: above[0]})) + " · " : ""}${new Date().toISOString().slice(0, 10)}</div>
    ${house.length ? `<h2>${t("Under your headship: your house ({n})", {n: house.length})}</h2>${table(house, actingFor)}` : ""}
    ${bound.length ? `<h2>${t("In your care: houses with no man of their own line, bound to you by kinship ({n})", {n: bound.length})}</h2>${table(bound, k => S.bound[k].by === S.bound[k].via ? t("you are the nearest kinsman") : t("through {name}, head of the house", {name: esc(nm(S.bound[k].via))}))}` : ""}
    ${carried.length ? `<h2>${t("In your care: those you carry ({n})", {n: carried.length})}</h2>${table(carried, k => P(k).carried_note ? esc(P(k).carried_note) : "")}` : ""}
    ${headsUnder.length ? `<h2>${t("Under your headship as Head of the family: the heads of its houses ({n})", {n: headsUnder.length})}</h2>${table(headsUnder, k => memberCount(k) ? t("{n} in his house", {n: memberCount(k)}) : "")}` : ""}
    ${leftToHead.length ? `<h2>${t("Under the Head of the family directly: in a headless house with no kinsman bound to it ({n})", {n: leftToHead.length})}</h2>${table(leftToHead)}` : ""}
    <h2>${t("Notes")}</h2><div class="notebox"></div>`;
  window.print();
}

/* if he dies: who takes up each house he heads or keeps, the next Head of the family, minors without a guardian */
async function ifDies(id) {
  let r; try { r = await api("GET", "/api/ifdies?id=" + id); } catch (e) { return alert(e.message); }
  const name = k => k == null ? `<b>${t("no one: the Head of the family")}</b>` : esc(nm(k)) + (shared(k) && yr(P(k)) ? ` <span class="mute">${t("(b. {year})", {year: yr(P(k))})}</span>` : "");
  const by = {}, own = r.changes.filter(c => c.after === c.id);
  for (const c of r.changes) if (c.after !== c.id) (by[c.after ?? "none"] ||= []).push(c);
  openDlg(`<h2>${t("If {name} dies", {name: esc(nm(id))})}</h2>
    <p class="mute" style="margin-top:0">${t("Worked out by the same rules the family uses now; nothing is changed.")}</p>
    <p>${t("Head of the family: {who}", {who: r.head_before === r.head_after ? t("{name} (unchanged)", {name: name(r.head_after)}) : t("{a} takes the place of {b}", {a: `<b>${name(r.head_after)}</b>`, b: name(r.head_before)})})}</p>
    ${own.length ? `<div class="sect"><h3>${t("Become heads of their own houses")}</h3><div>${own.map(c => name(c.id)).join(" · ")}</div></div>` : ""}
    ${Object.entries(by).map(([h, cs]) => `<div class="sect"><h3>${t("Under {who}", {who: h === "none" ? t("no man: the Head of the family") : name(+h)})}</h3>
      <div>${cs.map(c => `${name(c.id)}${c.bound ? ` <span class="mute">${t("(bound by kinship)")}</span>` : ""}${c.minor ? (c.guardian ? ` <span class="tag confirmed">${t("minor · guardian named: {name}", {name: esc(nm(c.guardian))})}</span>` : ` <span class="tag draft">${t("minor · no guardian named")}</span>`) : ""}`).join(" · ")}</div></div>`).join("")}
    ${!r.changes.length ? `<p>${t("No one's headship changes.")}</p>` : ""}
    ${r.minors_unguarded.length ? `<p style="margin-top:10px"><b>${r.minors_unguarded.length > 1 ? t("{n} minors with no guardian named.", {n: r.minors_unguarded.length}) : t("{n} minor with no guardian named.", {n: r.minors_unguarded.length})}</b> ${t("A parent names one in his will (Edit the child to record it).")}</p>` : ""}
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="window.print()">${t("Print")}</button> <button class="btn pri" onclick="dlg.close()">${t("Close")}</button></div>`);
  $("#sheet").innerHTML = dlg.innerHTML.replace(/<button[^>]*>.*?<\/button>/g, "");
}

/* the register of a house to the fourth generation, and the graves of the family, to print and hand down */
function printRegister(id) {
  if (!E || egoId !== id) return alert(t("Stand as this person first."));
  const me = P(id), gen = {P: "Parents", PP: "Grandparents", PPP: "Great-grandparents", PPPP: "Great-great-grandparents"};
  const rels = Object.entries(E.rels).map(([k, r]) => [+k, r.them]);
  const dates = p => esc(life(p) || t("dates not recorded"));
  const row = (k, extra) => { const p = P(k); return `<tr><td><b>${esc(p.name)}</b>${p.ko_name ? " " + esc(p.ko_name) : ""}<div class="small">${esc(extra || "")}</div></td><td>${dates(p)}</td>
    <td>${dead(p) ? (p.burial ? esc(p.burial) : `<span class="small">${t("grave not recorded")}</span>`) : `<span class="small">${t("living")}</span>`}</td><td class="notes"></td></tr>`; };
  const table = rows => `<table class="charge"><tr><th>${t("Name")}</th><th>${t("Dates")}</th><th>${t("Grave")}</th><th>${t("Notes")}</th></tr>${rows.join("")}</table>`;
  const up = Object.keys(gen).map(g => [g, rels.filter(([k, x]) => x.path === g).map(([k, x]) => k)]).filter(([g, ks]) => ks.length);
  const down = rels.filter(([k, x]) => /^S?C{1,2}$/.test(x.path) || x.path === "S").map(([k]) => k)
    .sort((a, b) => E.rels[a].them.path.length - E.rels[b].them.path.length || (P(a).birth || "9").localeCompare(P(b).birth || "9"));
  const keeper = id === S.lineage_heir || id === theHead();     // the heir and the Head see to the family's graves (duty: the heir's office)
  const graves = !keeper ? [] : rels.filter(([k, x]) => dead(P(k)) && x.tags.includes("kin") && !x.tags.includes("paramour")).map(([k]) => k)
    .sort((a, b) => (P(a).burial || "~").localeCompare(P(b).burial || "~") || a - b);
  $("#sheet").innerHTML = `<h1>${t("The register of {name}", {name: esc(me.name) + (me.ko_name ? " " + esc(me.ko_name) : "")})}</h1>
    <div class="small">${esc(life(me))} · ${t("kept to the fourth generation, as the house's remembrance reaches")} · ${new Date().toISOString().slice(0, 10)}</div>
    ${up.map(([g, ks]) => `<h2>${t(gen[g])}</h2>${table(ks.sort((a, b) => (P(a).sex === "m" ? 0 : 1) - (P(b).sex === "m" ? 0 : 1)).map(k => row(k, E.rels[k].them.en.split(" (")[0])))}`).join("")}
    ${down.length ? `<h2>${t("The house: wife, children and grandchildren")}</h2>${table(down.map(k => row(k, E.rels[k].them.en.split(" (")[0])))}` : ""}
    ${graves.length ? `<h2>${t("Graves of the family ({n}), in your keeping as {office}", {n: graves.length, office: id === S.lineage_heir ? t("heir of the main line") : t("Head of the family")})}</h2>${table(graves.map(k => row(k, E.rels[k].them.en.split(" (")[0])))}` : ""}
    <h2>${t("Notes")}</h2><div class="notebox"></div>`;
  window.print();
}

/* ---------- start ---------- */
async function fromHash() {         // deep links: #ego=12&sel=30&view=fan · #tab=atlas&av=authority · #tab=way&q=filial
  const hash = new URLSearchParams(location.hash.slice(1));
  const saved = +(hash.get("ego") || localStorage.getItem("way-ego"));
  const ego = P(saved) ? saved : (S.me && P(S.me) ? S.me : null);
  if (ego !== egoId || !E) { egoId = ego; await loadEgo(); recenter = true; }
  const tab = ["map", "atlas", "between", "way", "rulings", "clan", "about"].includes(hash.get("tab")) ? hash.get("tab") : "stand";
  sel = tab === "stand" && E && E.rels[+hash.get("sel")] ? +hash.get("sel") : null;
  if (VIEWS.includes(hash.get("view"))) view = hash.get("view");
  reach = hash.get("reach") === "wide" ? "wide" : "close"; $("#reachBtn").textContent = reach === "close" ? t("Wider") : t("Closer");
  if (["network", "houses", "lines", "authority", "lifelines"].includes(hash.get("av"))) atlasView = hash.get("av");
  atlasSel = tab === "atlas" && P(+hash.get("sel")) ? +hash.get("sel") : null;
  if (hash.get("q")) { libQ = hash.get("q"); libHits = (await api("GET", "/api/library?q=" + encodeURIComponent(libQ))).results; }
  showTab(tab); render();
}
window.addEventListener("hashchange", fromHash);
window.addEventListener("resize", () => { clearTimeout(window._rs); window._rs = setTimeout(() => { const tab = document.querySelector("nav button.on").dataset.tab; if (tab === "stand" || tab === "atlas") render(); }, 200); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !dlg.open && document.activeElement.tagName !== "INPUT") { if (sel != null) { sel = null; draw(); panel(); syncHash(); } if (atlasSel != null) { atlasSel = null; drawAtlas(); } } });
function onLangChange() { if (!S) return; ["ex-banner", "ro-banner"].forEach(b => { const x = document.getElementById(b); if (x) x.remove(); }); chrome(); render(); }     // i18n.js calls this after a new language is loaded
(async () => { await loadLang(); await loadState(); await fromHash(); maybeWelcome(); })();
</script>
