<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Way">
<title data-i18n>The Way</title>
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#23201b;--mute:#7a7265;--line:#e2d9c8;--seal:#8c2f1b;
  --kept:#3b7d4f;--strained:#c98a1b;--broken:#b33a2b;--severed:#1d1b19;--unset:#b9b0a0;--open:#2f6f9f;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:calc(56px + var(--top)) 0 calc(68px + var(--bot));overscroll-behavior-y:contain}
h1,h2,h3{font-family:Georgia,"Noto Serif KR",serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ko{font-family:"Noto Serif KR",serif;color:var(--seal)}
.about{font-size:15.5px;line-height:1.6}.about .lead{font-size:19px;font-weight:600}.about h3{margin:20px 0 4px}.about dt{font-weight:600;margin-top:10px}.about dd{margin:2px 0 0 0}
.mute{color:var(--mute)}
.small{font-size:13px}
/* chrome */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:var(--top) 6px 0;height:calc(56px + var(--top));display:flex;align-items:center;gap:4px}
.top h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.top h1 span{color:var(--seal)}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:22px;display:grid;place-items:center;font-size:22px;cursor:pointer;flex:none}
.iconbtn:active{background:#0000000d}
.egochip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:7px;max-width:52vw;cursor:pointer;flex:none}
.egochip b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--bot)}
.tabs button{flex:1;border:0;background:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mute);cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--seal);font-weight:600}
.tabs .pip{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--seal);color:#fff;font-size:10px;line-height:17px;padding:0 4px;font-weight:600}
main{padding:12px 12px 24px;max-width:640px;margin:0 auto}
/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card>h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card>h3 .grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.list{margin:0 -14px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;border-top:1px solid var(--line);cursor:pointer;text-decoration:none}
.item:active{background:#0000000a}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;font-size:13px;color:var(--mute);flex:none}
.chev{color:#c4bba9;font-size:20px;flex:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;border:2px solid var(--c,#8d8473);background:color-mix(in srgb,var(--c,#8d8473) 14%,#fff);color:var(--ink)}
.av.f{border-radius:50%}.av.m{border-radius:12px}
.av.dead{border-style:dashed;background:#ece6d9;color:#6d665a}
.av.lg{width:64px;height:64px;font-size:22px}
.av.cut{background:#1d1b19;color:#fff;border-color:#1d1b19}
.badge{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 6px;color:#fff;background:var(--b,#7a7265);text-transform:uppercase;letter-spacing:.04em;font-weight:600;vertical-align:2px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--unset);flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:500}
.btn:active{background:#0000000d}
.btn.pri{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}
.seg{display:flex;background:#ebe4d6;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;min-height:36px;font-size:14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px #0002}
.search{position:sticky;top:calc(56px + var(--top));z-index:5;background:var(--paper);padding:2px 0 10px;margin-top:-2px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-size:16px}
.ghead{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--seal);font-weight:600;margin:16px 4px 6px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
/* stat ring + tiles */
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{text-decoration:none;color:inherit;display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);border-left:4px solid var(--line);cursor:pointer}
.tile b{display:block;font-family:Georgia,serif;font-size:24px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--mute)}
.tile.warn{border-left-color:var(--strained)}.tile.bad{border-left-color:var(--broken)}.tile.ok{border-left-color:var(--kept)}.tile.ok b{color:var(--mute)}
/* clan */
details.house{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;border-left:4px solid #8d8473}
details.house.headhouse{border-left-color:var(--seal)}details.house.gone{border-left-color:var(--strained)}details.house.mine{box-shadow:0 0 0 2px var(--ink)}
details.house>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:64px}
details.house>summary::-webkit-details-marker{display:none}
details.house>summary .t{flex:1;min-width:0}details.house>summary .t b{display:block;font-weight:600}
details.house>summary .t small{display:block;color:var(--mute);font-size:13px}
details.house>summary::after{content:"›";color:#b5ac99;font-size:24px;transform:rotate(90deg);transition:transform .15s}
details.house[open]>summary::after{transform:rotate(-90deg)}
details.house .hsub{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:10px 14px 4px;border-top:1px solid var(--line)}
details.house .hsub a{text-transform:none;letter-spacing:0;font-size:13px}
.item.mem{border-top:1px dotted var(--line);min-height:50px}
.item.mem.hit{background:#f6e7b8!important}
.item.byright{box-shadow:inset 4px 0 var(--strained);background:#fbf6ea}.item.bound{box-shadow:inset 4px 0 var(--open);background:#f2f6fa}
.headcard{border-left:4px solid var(--seal)}
.trunk{width:2px;height:14px;background:var(--line);margin:-12px auto 0}
details.succ summary{font-size:14px;cursor:pointer;padding:6px 0 0}details.succ ol{margin:6px 0 0;padding-left:22px;font-size:14px}details.succ li{margin:3px 0}
.hbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#e6dfd0;gap:2px;margin-top:5px}.hbar.big{height:14px;border-radius:7px}
.hbar i{display:block;height:100%}
.srow{padding:9px 0;border-top:1px solid var(--line)}.srow:first-of-type{border-top:0}
/* person page */
.hero{display:flex;gap:14px;align-items:center}
.hero h2{font-size:24px;line-height:1.2}
.relbox{background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.relbox div+div{margin-top:3px}
.bondrow{margin-top:10px}
.bondrow .lbl{font-size:13px;color:var(--mute);margin-bottom:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:38px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{color:#fff}
.chip.on.kept{background:var(--kept);border-color:var(--kept)}.chip.on.strained{background:var(--strained);border-color:var(--strained)}
.chip.on.broken{background:var(--broken);border-color:var(--broken)}.chip.on.severed{background:var(--severed);border-color:var(--severed)}
details.sph{border-top:1px solid var(--line);margin:0 -14px}
details.sph>summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:15px}
details.sph>summary::-webkit-details-marker{display:none}
details.sph>summary::after{content:"›";margin-left:auto;color:#b5ac99;font-size:22px;transform:rotate(90deg);transition:transform .15s}
details.sph[open]>summary::after{transform:rotate(-90deg)}
.duty{padding:10px 14px;border-top:1px dotted var(--line)}
.duty p{margin:0 0 4px;font-size:15px}
details.dx>summary{list-style:none;cursor:pointer;font-size:15px;margin:0 0 4px}details.dx>summary::-webkit-details-marker{display:none}
details.dx>summary::before{content:"▸";display:inline-block;width:1em;color:var(--mute);transition:transform .12s}
details.dx[open]>summary::before{transform:rotate(90deg)}details.dx>.src{margin:0 0 6px 1em}
.duty .src{font-size:12px;color:var(--mute)}
.marks{display:flex;gap:5px;margin-top:8px}
.marks button{flex:1;min-width:0;padding:0 2px;white-space:nowrap;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:14px;color:var(--mute)}
.marks button.on.kept{background:var(--kept);border-color:var(--kept);color:#fff}
.marks button.on.failing{background:var(--broken);border-color:var(--broken);color:#fff}
.marks button.on.poorly{background:var(--strained);border-color:var(--strained);color:#fff}
.marks button.on.na{background:var(--unset);border-color:var(--unset);color:#fff}
.tag{font-size:10px;border:1px dashed var(--line);border-radius:3px;padding:0 4px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.mini{display:inline-flex;height:7px;width:60px;border-radius:4px;overflow:hidden;background:#e6dfd0;vertical-align:middle;gap:1px}
.mini i{display:block;height:100%}
/* family navigator */
.trail{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none;font-size:13px}
.trail a{white-space:nowrap;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
.trail a.on{color:var(--ink);border-color:var(--ink)}
.focus{text-align:center;padding:18px 14px}
.focus .av{margin:0 auto 8px}
.focus h2{font-size:23px}
.kinrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.kin{flex:none;width:104px;scroll-snap-align:start;text-align:center;cursor:pointer;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.kin:active{background:#0000000d}
.kin .av{margin:0 auto 6px}
.kin b{display:block;font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kin small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* examine */
.deck{position:relative;min-height:380px;touch-action:pan-y}
.dcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px #0000000f;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform}
.dcard.fly{transition:transform .25s ease-out,opacity .25s}
.dcard .who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dcard .sph{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.dcard .text{font-family:Georgia,"Noto Serif KR",serif;font-size:22px;line-height:1.35;margin:6px 0 14px}
.dcard .stamp{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:700;font-size:20px;opacity:0;transform:rotate(-8deg);text-transform:uppercase;letter-spacing:.06em}
.dcard .stamp.k{right:16px;color:var(--kept);border-color:var(--kept)}
.dcard .stamp.f{left:16px;color:var(--broken);border-color:var(--broken);transform:rotate(8deg)}
.bigmarks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.bigmarks button{min-height:56px;border-radius:14px;border:0;font-size:16px;font-weight:600;cursor:pointer;color:#fff}
.bigmarks .failing{background:var(--broken)}.bigmarks .poorly{background:var(--strained)}.bigmarks .kept{background:var(--kept)}
.bigmarks button{line-height:1.15;padding:4px}
.bar{height:6px;background:#e6dfd0;border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--kept)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(78px + var(--bot));z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;transform:translateY(calc(100% + 90px));transition:transform .2s,visibility .2s;max-width:616px;margin:0 auto;visibility:hidden;pointer-events:none}
.toast.on{transform:none;visibility:visible;pointer-events:auto}
.toast button{border:0;background:none;color:#f3c7b8;font-weight:700;cursor:pointer;min-height:36px;padding:0 6px}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
select.plain{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:40px;padding:0 10px;max-width:100%}
textarea.note,input.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;margin-top:6px;font-size:15px}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" hidden aria-label="Back" data-i18n-attr="aria-label" onclick="goBack()">‹</button>
  <h1 id="title">The Way<span> 道</span></h1>
  <button class="egochip" id="egoChip" onclick="go('#pick')" aria-label="Who you stand as" data-i18n-attr="aria-label"></button>
</header>
<main id="view"><div class="loading" data-i18n>Loading…</div></main>
<nav class="tabs" id="tabs">
  <button data-r="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n>Today</span></button>
  <button data-r="family"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M5 16.5V14h14v2.5M12 11.5v2.5"/></svg><span data-i18n>Family</span></button>
  <button data-r="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span data-i18n>People</span></button>
  <button data-r="examine"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 16h8"/></svg><span data-i18n>Examine</span><span class="pip" id="pip" hidden></span></button>
  <button data-r="clan"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 4l9 5.5M5.5 10v8M10 10v8M14 10v8M18.5 10v8M3 20.5h18"/></svg><span data-i18n>Clan</span></button>
</nav>
<div class="toast" id="toast"><span class="grow" id="toastMsg"></span><button id="toastBtn" data-i18n>Undo</button></div>

<script src="/i18n.js"></script>
<script src="/about.js"></script>
<script>
"use strict";
/* The Way, for the phone. Same server and data as the full site (index.html); this page is served at "/"
   to mobile browsers, and always at /m. Routes live in the address hash so the back button works:
   #today · #family/ID · #people · #examine[/ID] · #clan[/authority|state|you] · #p/ID · #pick */
let S = null, E = null, egoId = null, navDepth = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const P = id => S.people[id];
const nm = id => P(id) ? P(id).name : "?";
const dead = p => p.living === undefined ? !!p.death : !p.living;
const yr = p => (p.birth || "").slice(0, 4);
const life = p => (yr(p) || p.death) ? `${yr(p) || "?"}–${p.death ? (p.death === "?" ? "" : p.death.slice(0, 4)) : ""}` : "";
const NOW = new Date(), THIS_YEAR = NOW.getFullYear();   // ages only
const age = p => { const b = parseInt(yr(p)); if (!b) return null; const d = dead(p) ? parseInt((p.death || "").slice(0, 4)) : THIS_YEAR; return d ? d - b : null; };
const standing = p => (p.standing && p.standing !== "member") ? p.standing : "";
const ST_COL = {entering: "#2f6f9f", estranged: "#c98a1b", cut_off: "#1d1b19", outside: "#8a8578"};
const SEV = {kept: 1, strained: 2, broken: 3, severed: 4};
const CLOSE = new Set(["P", "PP", "S", "PC", "C", "CC", "CS", "SP", "PS", "SC", "X", "K", "Q", "PSC"]);
const SIDE = {self: ["me", "#23201b"], spouse: ["Spouse", "#eda100"], father: ["Father’s side", "#2a78d6"], mother: ["Mother’s side", "#eb6834"],
  siblings: ["Brothers & sisters", "#1baf7a"], children: ["Descendants", "#e87ba4"], inlaws: ["Spouse’s side", "#008300"], none: ["No known tie", "#b9b0a0"]};

const READONLY_MSG = "This is a read-only demonstration of The Way with an example family. Download it to keep your own family's record.";
window.alert = (a => m => { if (m !== "read-only") a(m); })(window.alert.bind(window));   // the refusal is said once
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.message === "read-only") e.preventDefault(); });
async function api(method, path, body) {
  if (method !== "GET" && typeof S !== "undefined" && S && S.read_only) { alert(t(READONLY_MSG)); throw new Error("read-only"); }
  const r = await fetch(path, {method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const ofFamily = id => (S.familySet ||= new Set(S.family || [])).has(id);   // under the Head's authority (the server decides)
async function loadState() {
  const s = await api("GET", "/api/state");
  s.people = Object.fromEntries(s.people.map(p => [p.id, p]));
  s.duties = Object.fromEntries(s.duties.map(d => [d.id, {...d, attest: []}]));
  for (const a of s.attest || []) if (s.duties[a.duty_id]) s.duties[a.duty_id].attest.push(a);
  const kids = {}, parents = {}, spouses = {};
  for (const l of s.links) { (kids[l.parent_id] ||= []).push(l.child_id); (parents[l.child_id] ||= []).push(l.parent_id); }
  for (const u of s.unions) { (spouses[u.a_id] ||= []).push([u.b_id, u.status]); (spouses[u.b_id] ||= []).push([u.a_id, u.status]); }
  s.ix = {kids, parents, spouses};
  S = s;
  if (S.read_only && !document.getElementById("ro-banner")) document.body.insertAdjacentHTML("afterbegin",
    `<div id="ro-banner" data-i18n data-i18n-key="Read-only demonstration with an example family. Nothing here can be changed." style="background:#7a2a1a;color:#fff;text-align:center;padding:6px 12px;font-size:13px">${t("Read-only demonstration with an example family. Nothing here can be changed.")}</div>`);
}
async function loadEgo() { E = egoId != null && P(egoId) ? await api("GET", "/api/ego/" + egoId) : null; }
async function standAs(id, then = "#today") {
  egoId = id; localStorage.setItem("way-ego", id);
  $("#view").innerHTML = `<div class="loading">${t("Standing as {name}…", {name: esc(nm(id))})}</div>`;

/* ---------- small helpers ---------- */
function sideOf(id) {

  const r = E && E.rels[id]; if (!r) return "none";
  const p = r.them.path;
  if (/^[SXKQ]$/.test(p)) return "spouse";
  if (/^[SXKQ]/.test(p)) return "inlaws";
  if (p[0] === "C") return "children";
  if (/^PS?C/.test(p)) return "siblings";
  let v = id;
  for (let i = 0; i < 12 && E.rels[v] && E.rels[v].via !== egoId; i++) v = E.rels[v].via;
  return P(v) && P(v).sex === "f" ? "mother" : "father";
}
const initials = n => n.replace(/\(.*?\)/g, "").trim().split(/[\s,]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
function av(id, lg) {

}
const relEn = id => id === egoId ? t("you") : E && E.rels[id] ? E.rels[id].them.en.split(" (")[0] : t("no known tie");
const relKo = id => E && E.rels[id] ? native(E.rels[id].them).split(" (")[0] : "";
const stBadge = p => standing(p) ? ` <span class="badge" style="--b:${ST_COL[standing(p)]}">${esc(t(S.meta.standings[standing(p)]))}</span>` : "";
const headBadge = id => id === S.head ? ` <span class="badge" style="--b:var(--seal)">${t("Head of the family")}</span>` : "";
function bondOf(id) {

}
function counts(ids, marks) {
  const c = {kept: 0, poorly: 0, failing: 0, na: 0, open: 0, all: 0};
  for (const d of ids) { if (!S.duties[d] || S.duties[d].status === "retired") continue; c.all++; const m = marks && marks[d]; c[m && c[m.state] != null ? m.state : "open"]++; }
  return c;
}
const mini = c => c.all ? `<span class="mini">${[["failing", "var(--broken)"], ["poorly", "var(--strained)"], ["kept", "var(--kept)"], ["na", "#b9b0a0"]].filter(([k]) => c[k]).map(([k, col]) => `<i style="flex:${c[k]};background:${col}"></i>`).join("")}<i style="flex:${c.open};background:transparent"></i></span>` : "";
function nearness(a, b) {

  const w = p => ({S: 0, P: 1, C: 2, PC: 3, PSC: 3.5, CC: 4, PP: 5, SP: 6, CS: 7, X: 8, K: 8})[p] ?? 10 + p.length;

}

/* ---------- routing ---------- */

/* ---------- Today ---------- */

  const done = tot.all - tot.open, pct = tot.all ? done / tot.all : 0, C = 2 * Math.PI * 36;

/* ---------- Person page ---------- */
function headText(id) {

  else if (b) bits.push(t("Acting head, bound by kinship: {name}", {name: link(b.by)}) + (right != null && right !== id ? " · " + t("by right under {name}", {name: link(right)}) + gone(right) : ""));
  else if (right != null && right !== id && right !== h) bits.push(t("By right under {name}; acting head: {head}", {name: link(right) + gone(right), head: h != null ? link(h) : t("the Head of the family")}));

      <div class="trunk"></div>` : `<div class="card" style="border-color:var(--broken)">${t("{label} no living man found. Name one on the full site's Clan tab.", {label: `<b>${t("No Head of the family:")}</b>`})}</div>`}
    <div class="search" style="top:calc(56px + var(--top))"><input type="search" id="aq" placeholder="${t("Who is under whom? Type a name…")}" value="${esc(authQ)}" autocomplete="off">
      <div class="trail" style="margin-top:8px;padding-bottom:0">${filters.map(([k, v]) => `<a href="#clan/authority" class="${authFilter === k && !tq ? "on" : ""}" onclick="authFilter='${k}';authQ='';renderAuthority();return false">${v}</a>`).join("")}</div></div>
    ${authFilter === "all" && !tq && top != null ? houseCard(top, keep, myHouse === top) : ""}
    ${list.map(h => houseCard(h, keep, !!tq || h === myHouse)).join("") || `<div class="empty">${t("No house matches.")}</div>`}
    ${headless.length && !tq ? `<div class="card" id="headless" style="border-left:4px solid var(--broken)"><h3>${t("Headless, and no kinsman bound")}</h3>
      <p class="small mute" style="margin:0 0 6px">${t("These fall directly under the Head of the family. Record a husband, father or brother on the full site to set them under a man.")}</p>
      <div class="list">${headless.map(i => personItem(i, ageNum(i))).join("")}</div></div>` : ""}
    ${!tq ? `<div class="card"><h3>${t("Where you stand")}</h3><p class="small" style="margin:0">${headText(egoId).replace(/<div[^>]*>|<\/div>/g, "")}</p></div>` : ""}`;
  const q = $("#aq"); q.oninput = () => { authQ = q.value; const pos = q.selectionStart; renderAuthority(); const n = $("#aq"); n.focus(); n.setSelectionRange(pos, pos); };
}
const gone = id => P(id) && P(id).headship ? ` <span class="badge" style="--b:var(--strained)">${esc(t(S.meta.headship[P(id).headship]))}</span>` : "";

/* State of the clan: bonds, duties failing, by sphere and person, standing, households */
async function renderClanState() {
  const box = $("#clanBody");
  if (!rollup || rollup.S !== S) { box.innerHTML = `<div class="loading">${t("Gathering…")}</div>`; rollup = Object.assign(await api("GET", "/api/rollup"), {S}); }
  const R = rollup, c = R.bond_counts, judged = Object.values(c).reduce((a, b) => a + b, 0);
  const bar = v => `<span class="hbar">${v.kept + (v.poorly || 0) + v.failing ? `<i style="flex:${v.kept};background:var(--kept)"></i><i style="flex:${v.poorly || 0};background:var(--strained)"></i><i style="flex:${v.failing};background:var(--broken)"></i>` : ""}</span>`;
  const tally = v => `${t("{n} kept", {n: v.kept})} · ${t("{n} not well", {n: v.poorly || 0})} · ${t("{n} failing", {n: v.failing})}`;
  const ST_ORDER = ["kept", "strained", "broken", "severed"];
  const stCount = (k, n) => k === "kept" ? t("{n} kept", {n}) : k === "strained" ? t("{n} strained", {n}) : k === "broken" ? t("{n} broken", {n}) : t("{n} severed", {n});
  const stand = Object.values(S.people).filter(p => standing(p));
  const living = Object.values(S.people).filter(p => !dead(p) && ofFamily(p.id));
  const headless = living.filter(p => S.heads[p.id] == null).length;
  box.innerHTML = `
    <div class="card"><h3>${t("What needs attention")}</h3><div class="tiles">
      <a class="tile ${R.torn.length ? "bad" : "ok"}" href="#clan/state" onclick="document.getElementById('torn').scrollIntoView({behavior:'smooth'});return false"><b>${R.torn.length}</b><span>${t("bonds torn: strained, broken or severed")}</span></a>
      <a class="tile ${R.failing.length ? "bad" : "ok"}" href="#clan/state" onclick="document.getElementById('failing').scrollIntoView({behavior:'smooth'});return false"><b>${R.failing.length}</b><span>${t("duties failing or not doing well")}</span></a>
      <a class="tile ${headless ? "bad" : "ok"}" href="#clan/authority"><b>${headless}</b><span>${t("in a headless house no kinsman is bound to")}</span></a>
      <a class="tile ${stand.length ? "warn" : "ok"}" href="#clan/state" onclick="document.getElementById('standing').scrollIntoView({behavior:'smooth'});return false"><b>${stand.length}</b><span>${t("not in full standing")}</span></a></div></div>
    <div class="card" id="torn"><h3>${t("State of the bonds")}</h3>
      ${judged ? `<div class="hbar big">${ST_ORDER.filter(k => c[k]).map(k => `<i style="flex:${c[k]};background:var(--${k})"></i>`).join("")}</div>
        <div class="chips" style="margin:8px 0 4px">${ST_ORDER.map(k => `<span class="chip on ${k}" style="cursor:default;min-height:30px;display:inline-flex;align-items:center">${stCount(k, c[k] || 0)}</span>`).join("")}</div>`
        : `<p class="small mute" style="margin:0">${t("No bond has been judged yet. Open a person and set the bond.")}</p>`}
      ${R.torn.length ? `<div class="list" style="margin-top:8px">${R.torn.map(x => `<a class="item" href="#" onclick="openPair(${x.a},${x.b});return false">${av(x.a)}<div class="t"><b>${esc(nm(x.a))} → ${esc(nm(x.b))}</b><small>${esc(x.note || t("no note"))}</small></div><span class="chip on ${x.state}" style="min-height:28px;display:inline-flex;align-items:center;font-size:12px">${t(x.state)}</span></a>`).join("")}</div>` : ""}</div>
    <div class="card" id="failing"><h3>${t("Duties failing or not doing well")}</h3>
      ${R.failing.length ? `<div class="list">${R.failing.map(f => `<a class="item" href="#" onclick="${f.toward ? `openPair(${f.person},${f.toward})` : `openPair(${f.person},${f.person})`};return false">${av(f.person)}<div class="t"><b>${esc(nm(f.person))}${f.toward ? " → " + esc(nm(f.toward)) : " → " + t("the house")}</b><small style="white-space:normal">${esc(dtext(S.duties[f.duty]))}</small></div><span class="chip on ${f.state === "failing" ? "broken" : "strained"}" style="min-height:26px;display:inline-flex;align-items:center;font-size:11.5px;padding:0 9px;flex:none">${f.state === "failing" ? t("failing") : t("not well")}</span></a>`).join("")}</div>` : `<p class="small mute" style="margin:0">${t("None marked.")}</p>`}</div>
    <div class="card"><h3>${t("By sphere")}</h3>${Object.keys(S.meta.spheres).map(k => { const v = R.per_sphere[k] || {kept: 0, poorly: 0, failing: 0};
      return `<div class="srow"><div class="row"><span class="grow small">${esc(t(S.meta.spheres[k]))}</span><span class="small mute">${tally(v)}</span></div>${bar(v)}</div>`; }).join("")}</div>
    <div class="card"><h3>${t("By person")}</h3>${Object.keys(R.per_person).length ? Object.entries(R.per_person).sort((a, b) => b[1].failing - a[1].failing || (b[1].poorly || 0) - (a[1].poorly || 0) || b[1].kept - a[1].kept).map(([id, v]) =>
      `<a class="srow" href="#" onclick="openPair(${id},${id});return false" style="display:block;text-decoration:none"><div class="row"><span class="grow small"><b>${esc(nm(+id))}</b></span><span class="small mute">${tally(v)}</span></div>${bar(v)}</a>`).join("")
      : `<p class="small mute" style="margin:0">${t("No duties marked yet.")}</p>`}</div>
    <div class="card" id="standing"><h3>${t("Standing in the family")}</h3>${stand.length ? `<div class="list">${stand.map(p => personItem(p.id, `<span class="small">${esc(p.standing_date || "")}</span>`)).join("")}</div>`
      : `<p class="small mute" style="margin:0">${t("Everyone on record is a member in full standing.")}</p>`}</div>
    <div class="card"><h3>${t("Households")}</h3>${S.households.length ? S.households.map(h => { const ms = Object.values(S.people).filter(p => p.household_id === h.id);
      return `<div class="srow"><b>${esc(h.name)}</b><div class="small mute">${t("head: {name}", {name: h.head_id && P(h.head_id) ? `<a href="#p/${h.head_id}">${esc(nm(h.head_id))}</a>` : t("none set")})}</div>
        <div class="small">${ms.map(p => `<a href="#p/${p.id}">${esc(p.name)}</a>`).join(", ") || `<span class="mute">${t("no members yet")}</span>`}</div></div>`; }).join("") : `<p class="small mute" style="margin:0">${t("No households set. Add them on the full site.")}</p>`}</div>`;
}

/* You: who you stand as, and the switch to the full site */
function renderYou() {
  $("#clanBody").innerHTML = (E ? `
    <div class="card"><h3>${t("Standing as")}</h3><div class="row">${av(egoId)}<div class="grow"><b>${esc(nm(egoId))}</b><div class="small mute">${S.me === egoId ? t("This is you") : t("Not set as you")}</div></div>
      ${S.me === egoId ? "" : `<button class="btn" onclick="setMe()">${t("This is me")}</button>`}</div>
      <div class="btns"><a class="btn" href="#pick">${t("Stand as someone else")}</a>${S.me && S.me !== egoId && P(S.me) ? `<button class="btn" onclick="standAs(${S.me},'#clan/you')">${t("Back to me")}</button>` : ""}</div></div>` : `<div class="card"><a class="btn pri block" href="#pick">${t("Choose who you stand as")}</a></div>`) + `
    <div class="card"><h3>${t("Background")}</h3><p class="small" style="margin:0 0 8px">${S.mode === "example" ? t("Which example family to show.") : t("Which kinship terms appear beside the English.")}</p>
      <select style="width:100%;min-height:44px" onchange="setBackground(this.value)">${Object.entries(S.backgrounds || {}).map(([k, v]) => `<option value="${k}"${k === S.background ? " selected" : ""}>${esc(t(v))}</option>`).join("")}</select></div>
    <div class="card"><h3>${t("Language")}</h3>
      <select style="width:100%;min-height:44px" onchange="setLang(this.value)">${langOptions()}</select></div>
    <div class="card"><h3>${t("This is the phone view")}</h3><p class="small" style="margin:0 0 8px">${t("Phones get it automatically. The full site has the maps and the Atlas, editing people, and The Way's duty list.")}</p>
      <div class="btns"><a class="btn" href="/full${egoId != null ? "#ego=" + egoId : ""}" onclick="useFull()">${t("Use the full site on this device")}</a></div></div>`;
}
async function setBackground(bg) {
  if (S.mode === "example") { document.cookie = "way_bg=" + bg + "; path=/; max-age=31536000; samesite=lax"; localStorage.removeItem("way-ego"); location.hash = ""; location.reload(); return; }
  try { await api("PUT", "/api/setting", {key: "background", value: bg}); await loadState(); route(); } catch (e) { toast(e.message); }
}
function useFull() { document.cookie = "way_ui=full; path=/; max-age=31536000; samesite=lax"; }
async function setMe() { await api("PUT", "/api/setting", {key: "me", value: egoId}); await loadState(); route(); toast(t("Remembered: this is you")); }
/* the language changed (setLang in i18n.js): draw the page again in it */
function onLangChange() { if (!S) return; chrome(); route(); }

/* ---------- start ---------- */
(async () => {
  try {
    document.cookie = "way_ui=; path=/; max-age=0";              // on the phone view: back to automatic
    await loadLang();
    await loadState();
    let hash = location.hash.slice(1);
    const deep = hash.includes("=") ? new URLSearchParams(hash) : null;   // a link from the full site: #ego=12&sel=30
    const saved = +((deep && deep.get("ego")) || localStorage.getItem("way-ego"));
    egoId = P(saved) ? saved : (S.me && P(S.me) ? S.me : null);
    await loadEgo(); chrome();
    if (deep) hash = deep.get("sel") && P(+deep.get("sel")) ? "p/" + deep.get("sel") : "today";
    history.replaceState({d: 0}, "", "#" + (hash || "today")); route();
    maybeWelcome();
  } catch (e) { $("#view").innerHTML = `<div class="card"><h3>${t("Could not load")}</h3><p class="small">${esc(e.message)}</p><button class="btn" onclick="location.reload()">${t("Try again")}</button></div>`; }
})();
</script>
</body>
</html>
